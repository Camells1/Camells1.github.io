<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Shattercrown: a flat gold crown split by a clean crack, on a deep purple tile -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1d6e"/>
      <stop offset="1" stop-color="#12091f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0a321"/>
    </linearGradient>
    <clipPath id="l"><polygon points="0,0 268,0 262,96 238,214 270,256 234,512 0,512"/></clipPath>
    <clipPath id="r"><polygon points="268,0 512,0 512,512 234,512 270,256 238,214 262,96"/></clipPath>
    <g id="crown">
      <path d="M116 356 V176 L190 256 L256 134 L322 256 L396 176 V356 Z"/>
      <rect x="116" y="378" width="280" height="30" rx="15"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="url(#gold)" transform="translate(-8 4)">
    <use href="#crown" clip-path="url(#l)"/>
    <g transform="translate(16 -12) rotate(3 256 270)"><use href="#crown" clip-path="url(#r)"/></g>
  </g>
</svg>
